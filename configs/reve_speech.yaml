# D-125: REVE-Base on the speech-decoding benchmark protocol of Khanday et al. (2026, arXiv 2607.27268 v2).
# Values follow the paper; details the paper does not give are fixed in D-125.
seed: 20261025
cache_dir: data/cache/reve_speech
runs_dir: results/runs

ugr:                                       # UGR-MINDVOICE (OSF 6sh5d), table 2
  raw: data/raw/ugr_mindvoice              # server link -> NAS copy
  edf_glob: eeg/sub-*/ses-*/eeg/*_eeg.edf
  events_dir: meta/files/Data              # BIDS events.tsv (sample column at 1 kHz)
  sha256_list: data/raw/ugr_mindvoice.sha256
  exclude_subjects: [sub-15]               # excluded in the paper (ICA error)
  eog: [EOG1, EOG2]
  no_eog_sessions: {sub-13_ses-01: [TP9, TP10]}   # D-125 amendment 2: EOG1/EOG2 slots carry these labels; dropped, session without ICA
  notch_hz: 50
  band_hz: [0.1, 75.0]                     # zero-phase FIR (MNE firwin default)
  sfreq: 200                               # resampled before ICA (linear ops commute; D-125 1.1 step 3)
  ica: {method: fastica, n_components: 20, highpass_hz: 1.0, eog_threshold: 3.0,     # D-125 amendment 1 (was n_components 0.99)
        channel_sd_factor: 5.0, reject_p2p_uv: 1000.0, tstep_s: 2.0, min_fit_s: 120.0}
  speech_event: StartSpeech                # speech epoch [t0 - 0.5, t0 + 1.0) s, baseline first 0.5 s
  rest_offset_s: -1.0                      # rest epoch t0 = StartStimulus - 1.0 s -> [stim - 1.5, stim)
  pre_s: 0.5
  post_s: 1.0
  words: configs/reve_speech_words.tsv     # 60 words, 6 categories (T2/T3)

bci2020:                                   # BCI Competition 2020 Track 3, table 3
  raw: "data/raw/bci2020/BCI2020 EEG Signal for Words"
  sha256_list: data/raw/bci2020.sha256
  sha_base: data/raw/bci2020                # the sha256 list is relative to the dataset root
  band_hz: [0.5, 75.0]                     # Butterworth order 4, filtfilt
  butter_order: 4
  notch_hz: [50, 60]                       # iirnotch Q 30, filtfilt
  notch_q: 30
  sfreq: 200
  window_s: [0.0, 2.0]                     # imagery window; source epochs start at -0.5 s
  epoch_start_s: -0.5

tasks:                                     # chance = 1 / n_classes
  mode: {data: ugr, n_classes: 3, protocol: loso}       # overt / covert / rest
  cat:  {data: ugr, n_classes: 6, protocol: loso}
  word: {data: ugr, n_classes: 60, protocol: loso}
  bci_within: {data: bci2020, n_classes: 5, protocol: within}
  bci_loso:   {data: bci2020, n_classes: 5, protocol: loso}

train:                                     # paper 2.4
  optimizer: adam
  weight_decay: 1.0e-4
  batch: 128
  max_epochs: 100
  patience: 10                             # early stopping on the held-out (test) subject / validation split, as in the paper
  lr: {ugr: {eegnet: 1.0e-3, labram: 1.0e-3, reve: 1.0e-3},
       bci2020: {eegnet: 1.0e-3, labram: 1.0e-4, reve: 1.0e-4}}
  fm_scale: 100.0                          # foundation models: microvolts / 100 (REVE task config scale_factor 100)

arms:
  eegnet: {model: eegnet}                  # braindecode EEGNet defaults, per-epoch per-channel z-score
  labram: {model: labram, weights: data/raw/labram_weights}       # braindecode/labram-pretrained (HF cache copy)
  reve: {model: reve}
  reve_shuffle: {model: reve, shuffle_labels: true}               # labels permuted within each training subject
  reve_lr1e4: {model: reve, lr: 1.0e-4, tasks: [mode, cat, word]} # report-only sensitivity (UGR)

reve:
  weights: data/raw/reve_weights/reve-base/model.safetensors      # brain-bzh/reve-base@dc2a075
  positions: data/raw/reve_weights/reve-positions/positions.json  # brain-bzh/reve-positions@befa5b5
  encoder: {embed_dim: 512, depth: 22, heads: 8, head_dim: 64, mlp_dim_ratio: 2.66, use_geglu: true, freqs: 4,
            patch_size: 200, patch_overlap: 20}
  dropout: 0.3                             # official classifier, pooling "no"
  pad_to_multiple: 200                     # inputs must be whole seconds: 1.5 s UGR epochs get 0.5 s of zeros at the end

paper:                                     # Khanday et al. 2026, tables 2 and 3 (accuracy / balanced accuracy, %)
  mode: {EEGNet: 61.3, LaBraM: 57.3, EEGMamba: 56.6}
  cat: {EEGNet: 19.9, LaBraM: 17.0, EEGMamba: 19.3}
  word: {EEGNet: 2.8, LaBraM: 1.9, EEGMamba: 2.9}
  bci_within: {EEGNet: 26.7, LaBraM: 27.7, EEGMamba: 25.7, EEGConformer: 30.2}
  bci_loso: {EEGNet: 18.9, LaBraM: 20.2, EEGMamba: 19.3}
  reproduction_tolerance_pp: 5.0           # |ours - paper| > 5 pp for EEGNet or LaBraM -> "pipeline reproduction difference"

verdict:
  holm_alpha: 0.05
  bootstrap: 1000
  out: results/reve_speech/verdict.json
  baseline: results/baselines/reve_speech_de.json
