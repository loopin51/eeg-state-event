# Direction 3, step 2 (faculty review direction 3, experiment 2): context-conditional candidate sets for the faithfulness
# device. One trial per DailyDialog dialogue: context = preceding turns, target = the next utterance, 19 alternatives
# generated by a fixed public LM for the same context with matched length. Registered in docs/DECISIONS.md D-086.
out_dir: data/cache/d3_candidates
seed: 20261011
data:
  dailydialog_dir: data/raw/dailydialog/hf_parquet/default
  resid_fit: data/cache/d3_metric_gate/resid_fit.tsv      # D-075 length-regression texts (fixed, hashed)
trials:
  min_turn: 2                    # target is turn >= 2 (0-based), so the context has at least 2 turns
  max_context_turns: 6           # at most the 6 turns before the target are shown
  target_words: [4, 20]          # target length range (words); dialogues without an eligible turn are skipped
lm:
  model: Qwen/Qwen3.5-4B
  dtype: bfloat16
  max_new_tokens: 64
  temperature: 1.0
  top_p: 0.95
  samples_per_round: 16          # sampled continuations per context per round
  max_rounds: 8                  # rounds until 19 accepted alternatives; else the trial is dropped (reported)
  batch_contexts: 1              # contexts per generate call (x samples_per_round sequences)
filter:
  n_alternatives: 19
  len_tol_words: [2, 0.25]       # |words - target words| <= max(2, 0.25 * target words)
  max_one_side: 12               # length balance: at most 12 of 19 alternatives strictly shorter (or longer) than the target
  max_resid_cos_target: 0.80     # e5 residual cosine to the target must be below this (no paraphrases of the target)
  max_resid_cos_pair: 0.90       # and below this to every accepted alternative (no near-duplicates)
embedder: {model: intfloat/multilingual-e5-base, prefix: "query: "}
strata_quartiles: true           # residual cosine distance quartiles (pooled over trials), reported per alternative
