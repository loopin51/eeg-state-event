name: stageA_all_pilot3_mps
datasets:
- seediv
- deap
- faced
- seedvii
cache_root: data/cache
val_frac: 0.1
seed: 0
model:
  d: 512
  layers: 6
  heads: 8
  ffn: 2048
  d_event: 256
  d_state: 32
  d_tok: 32
  n_virtual: 32
  dropout: 0.1
  path_drop: 0.1
  mask_ratio: 0.5
  alphas:
  - 1.0
  - 1.0
  - 0.1
  - 0.1
  temp: 0.1
  center_in_batch: true
batch:
  coh_subjects: 8
  coh_trials: 4
  align_blocks: 2
  align_subjects: 12
  align_keys: 4
  n_random: 16
  align_weights:
    deap: 0.1
optim:
  lr: 0.0003
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.98
  warmup_frac: 0.05
  epochs: 100
  grad_clip: 1.0
  ema_start: 0.996
  grl_ramp_frac: 0.2
eval:
  every_steps: 100
  val_batches: 20
  patience: 100
  ema_beta: 0.9
ckpt_every_steps: 500
num_workers: 0
max_steps: 1200
