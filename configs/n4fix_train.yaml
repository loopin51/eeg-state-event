      adv_lambda: 0.0718017560538432
      dropout: 0.13964144572748916
      w_null: 0.12125253278388115
      n4_mode: nopool_dcov
    frozen_from: reve_nc hp11 (2026-10-30_nc_cho2017_reve_nc_s0_hp11); D-129 n4_mode
      nopool_dcov
  reve_nc_npf:
