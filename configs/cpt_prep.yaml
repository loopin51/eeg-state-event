# VERA-CPT (docs/08 §14.1, registered 2026-11-03): label-free continued-pretraining corpus, scripts/cpt_prep.py.
# Whole recordings; no labels, events, triggers or stimuli are read (only the files needed to find the recordings).
# Chain = VERA evaluation caches (configs/nc_prep.yaml, scripts/nc_prep.py, parameters read from that file so they cannot
# drift): <line> Hz notch (+ harmonics below the low-pass + 5 Hz, iirnotch Q 30, filtfilt) -> Butterworth 0.5-75 Hz order 4
# (sosfiltfilt) -> 200 Hz (resample_poly) -> bad channels (median-referenced SD above 10x / below 0.1x the median channel
# SD, spherical spline, nc_prep.fix_bad) -> common average over the EEG channels (nc_prep.car) -> microvolts, float32.
# Output per dataset: <cache_dir>/<name>/x.f32 (time-major [n_samples, C], recordings back to back), recordings.parquet,
# header.json. --smoke: 2 recordings into <smoke_dir>/<name>/.
chain_config: configs/nc_prep.yaml     # sfreq, band_hz, butter_order, notch_q, bad_sd_hi, bad_sd_lo, positions (REVE bank)
cache_dir: data/cache/cpt
smoke_dir: data/cache/cpt_smoke
summary_dir: results/nc/cpt            # --summary: corpus_summary.json and headers/<name>.json (copied back to the local repo)
tmp_dir: /tmp                          # server NVMe; one decompressed SparrKULee BDF per worker at a time, deleted after use
chunk_channels: 8                      # channels filtered at the native rate at once (THINGS-EEG2 1000 Hz, 1.5-1.9 h per file)
split: {fraction: 0.05, seed: 20261284, min_val: 1}   # validation recordings per dataset (reconstruction loss only)
# 128 -> 64 (ds004408): the TOL rule of scripts/nc_prep.py tol() (copied, nc_prep.py has it inline); the result must equal
# the channel_map of the TOL evaluation cache (same two MNE templates, no electrode file in ds004408)
biosemi128_check: data/cache/nc/tol/header.json
names64: [Fp1, AF7, AF3, F1, F3, F5, F7, FT7, FC5, FC3, FC1, C1, C3, C5, T7, TP7, CP5, CP3, CP1, P1, P3, P5, P7, P9, PO7,
          PO3, O1, Iz, Oz, POz, Pz, CPz, Fpz, Fp2, AF8, AF4, AFz, Fz, F2, F4, F6, F8, FT8, FC6, FC4, FC2, FCz, Cz, C2, C4,
          C6, T8, TP8, CP6, CP4, CP2, P2, P4, P6, P8, P10, PO8, PO4, O2]   # BioSemi 64 cap, 10-10 names (= nc_prep.yaml tol)
non_eeg: '^(Status|EXG\d+|[HV]?EOG.*|ECG.*|EMG.*|GSR\d*|Erg\d*|Resp|Plet|Temp|Aux\d*|stim|STI.*)$'   # dropped by name

excluded_datasets:                     # written to corpus_summary.json; no cache
  kul_aad: 'stored at 128 Hz by the provider (README: 0.5 Hz high-pass, 8192 -> 128 Hz): the 0.5-75 Hz chain cannot be built (Nyquist 64 Hz) and
    the N1 45-70 Hz band would be empty, so its per-recording band SD normalisation divides by about 0; every pretraining batch uses the same
    6 bands (team lead decision 2026-11-03)'

datasets:
  sparrkulee:
    raw: data/raw/sparrkulee
    md5_list: _list.tsv                # RDR file list (id, path, md5); every BDF is checked before it is read
    glob: 'sub-*/ses-*/eeg/*_eeg.bdf.gz'   # all tasks: listeningActive and restingState
    line_hz: 50
    line_hz_source: 'BIDS task-listeningActive_eeg.json PowerLineFrequency (checked); restingState has no sidecar (same lab, amplifier and cap)'
    bids_json: task-listeningActive_eeg.json
    channel_alias: {P07: PO7, P03: PO3}    # sub-015 header typo (configs/ext_prepare.yaml)
    exclude_subjects: [19, 20, 21, 22, 26] # restricted on RDR (configs/ext_prepare.yaml): public 80
    exclude_recordings:                    # the three recordings excluded in configs/ext_prepare.yaml (docs/08 §14.1)
      - sub-006/ses-shortstories01/eeg/sub-006_ses-shortstories01_task-listeningActive_run-06_eeg.bdf.gz
      - sub-017/ses-shortstories01/eeg/sub-017_ses-shortstories01_task-listeningActive_run-03_eeg.bdf.gz
      - sub-048/ses-varyingStories05/eeg/sub-048_ses-varyingStories05_task-listeningActive_run-04_eeg.bdf.gz
    exclude_reason: 'configs/ext_prepare.yaml exclude_recordings (dataset README: too few triggers); docs/08 §14.1'
    n_eeg: 64
    workers: 3                         # recordings processed in parallel (peak memory per worker measured in the smoke run)
  alice:
    raw: data/raw/alice_eeg/drum/extracted
    glob: 'eeg/S*/S*_alice-raw.fif'
    line_hz: 60
    line_hz_source: 'recording site University of Michigan, Ann Arbor, USA (60 Hz mains); DRUM README.txt gives no value'
    eeg_names: '^\d+$'                 # channels '1'..'61' (easycap-M10 numbering); VEOG and Aux5 dropped
    n_eeg: 61
    workers: 2
  ds004408:
    raw: data/raw/ds004408
    glob: 'sub-*/eeg/*_eeg.vhdr'
    line_hz: 50
    line_hz_source: 'BIDS PowerLineFrequency is n/a; recording site Trinity College Dublin, Ireland (Di Liberto et al. 2015), 50 Hz mains'
    n_eeg: 128
    scale_to_uv: 1.0                   # MNE value x this = microvolt (see scale_note)
    scale_note: 'the BrainVision files (pybv 0.7.5, IEEE float, resolution 0.1 uV) hold microvolt numbers written as volts: MNE returns
      them 1e6 too large (smoke job 973: channel SD median 7.5e6 after the chain with x1e6); x1.0 gives SD 7.5 uV (SparrKULee 8, Alice 6)'
    workers: 3
  things_eeg1:
    raw: data/raw/things_eeg1
    input: 'authors derivative derivatives/eeglab/*_continuous.set/.fdt (0.1-100 Hz FIR, average reference, 250 Hz, 64 channels incl. Cz);
      the raw BrainVision .eeg files are not on the server and are not downloaded (team lead 2026-11-03); the chain is applied on top (TOL precedent)'
    glob: 'derivatives/eeglab/sub-*_task-rsvp_continuous.set'   # the raw BrainVision .eeg files are not on the server
    line_hz: 50
    line_hz_source: 'BIDS sub-XX/eeg/*_eeg.json PowerLineFrequency (checked per recording)'
    n_eeg: 64
    workers: 2
  things_eeg2:
    raw: data/raw/things_eeg2/raw-eeg
    input: 'raw_eeg_training.npy of 10 subjects x 4 sessions (1000 Hz, 63 EEG + stim, volts); the 40 raw_eeg_test.npy stay sealed (D-111)'
    glob: 'sub-*/ses-*/raw_eeg_training.npy'   # raw_eeg_test.npy: D-111 seal (src/ese/things/rawio.py guard), not read
    excluded_files: {glob: 'sub-*/ses-*/raw_eeg_test.npy', reason: 'D-111 seal: the test files are opened only by the F-V verdict job (src/ese/things/rawio.py)'}
    line_hz: 50
    line_hz_source: 'recording site Berlin, Germany (Gifford et al. 2022), 50 Hz mains; the files hold no value'
    n_eeg: 63
    workers: 1
