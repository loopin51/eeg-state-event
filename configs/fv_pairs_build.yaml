# D-115 section 1, amendments 1-2: blur-level pairs and held-out blur predictors (no EEG, eeg-a4).
# scripts/fv_pairs_build.py (server gpuq CPU), scripts/fv_holdout.py (server gpuq CPU), scripts/fv_embed_blur.py (k3s RTX 5080).
# Space: original image CLIP embedding C minus the mean over the 14,540 non-development training images, L2-normalised.
# Low-level predictor set P (D-114 section 1 file): blurred (sigma 8) image CLIP, L_all and L_classic predictions, each minus the
# same mean and normalised. For each development image i: sibling s (the 9 other images of its concept) x foil f (the 1,990
# images of the other 199 development concepts); valid when every p in P gives cos(P(i), C(f)) - cos(P(i), C(s)) > 0.
# Main pair (amendment 1): one valid (s, f) drawn at random (pair_seed). Report-only pair: the valid (s, f) with the largest
# minimum margin over P (ties: smaller sibling image row, then smaller foil image row).
eegfree_config: configs/fv_eegfree.yaml       # embed_out (data/cache/fv_clip: index.json row order, clip_img, clip_img_blur), images, CLIP, AlexNet
train_config: configs/fv_train.yaml           # meta, dev concepts (salt FV-dev, n 200), names table, names_text (P1)
space: clip_img.npy
predictors:                                   # name: <embed_out>/<file> or <file>:<key> (npz)
  blur8: clip_img_blur.npy
  L_all: lowlevel_pred.npz:L_all
  L_classic: lowlevel_pred.npz:L_classic
lowlevel_summary: results/fv/lowlevel_predictor.json   # pred_file sha256 is checked before use
min_concepts: 100                             # D-115 1 / amendment 1 feasibility (2): fewer concepts or images with a valid pair -> close
min_images: 400
r_min: 0.6                                    # amendment 1 feasibility (1): C(i) picks s on the main pairs
pair_seed: 20262132                           # main pairs: rng = default_rng(pair_seed); images in index order, one rng.integers(n_valid)
                                              # per image over its valid combinations in (sibling row, foil row) order
center_out: data/cache/fv_pairs/center.npy    # the subtracted mean vector (float64 [1024]), sha256 in the json, not committed
blur4: null                                   # report only: fv_embed_blur run folder (clip_img_blur4_dev.npy, rows.json dev_rows); null -> not computed
holdout:                                      # amendment 1 held-out blur predictors (not used for pair selection), scripts/fv_holdout.py
  features_dir: null                          # fv_embed_blur run folder on the server (alex_blur8_fc7 / conv5); null -> H_b and H_c are skipped
  out: data/cache/fv_pairs/holdout_pred.npz   # keys H_a, H_b, H_c: [2000, 1024] float32 L2-normalised predictions of the centred C, development rows; key rows
  summary: results/fv_pairs/holdout.json      # CV tables, chosen penalties, sha256, development name MRP of each H
  fold_salt: 20262131                         # concept-level 5-fold CV over the 14,540 fit images: sha256("{folder}|20262131") order, i % 5
  folds: 5
  H_a: {input: clip_img_blur.npy, gamma_rel: [0.25, 0.5, 1, 2, 4], alphas: [0.001, 0.01, 0.1, 1, 10],
        median_stride: 7}                     # kernel ridge, RBF exp(-gamma |x - y|^2), gamma = gamma_rel / median squared distance among every 7th fit row
  H_b: {input: alex_blur8_fc7.npy}            # ridge (fv_gate.py ridge_fit: column standardisation, fv_eegfree.yaml ridge.alphas)
  H_c: {input: alex_blur8_conv5.npy}          # simulation only (eeg-b1), not in the comparison
blur_embed:                                   # scripts/fv_embed_blur.py (k3s RTX 5080, data group fv_embed)
  clip_dev_sigmas_px: [4, 8]                  # CLIP of the blurred development images; 8 checks against the existing clip_img_blur rows
  alexnet: {fc7_classifier: 6, conv5_features: 12}   # sigma-8 blurred input: fc7 = classifier[:6] output, conv5 = features[:12] channel mean
out_main: results/fv_pairs/pairs_main.json    # main pairs (random), read by eeg-b1's configs/fv_pairs.yaml
out_maxmargin: results/fv_pairs/pairs.json    # report-only pairs (largest minimum margin, 08d0365 file)
