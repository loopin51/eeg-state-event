# D-092 stage 0: DE + ridge baseline and ORDER meter on the Alice main split (segment 4-fold), before any decoder number.
cache_dir: data/cache/alice_eeg
source: eeg_hp05            # Défossez-arm EEG (0.5 Hz FIR, robust scaling); CAR over good channels at load time
features:
  w2v: w2v_seg              # wav2vec2-large-xlsr-53 layers 14-18 on each whole segment
window:
  tmin: -0.5
  tmax: 2.5
  offset_s: 0.15
  train_step_s: 0.5
eeg:
  clamp: 20.0
  baseline_s: 0.5
guard_s: 10.0               # D-092 boundary guard
out: results/baselines/alice_de_order
